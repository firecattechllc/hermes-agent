      Built-in file-backed memory tool is implemented and registered in the
      default toolset; no external provider required.
    validation_command: "python -c \"import tools.memory_tool\""
    implementation_paths:
      - tools/memory_tool.py
      - agent/memory_provider.py
      - agent/memory_manager.py
    node: shared

