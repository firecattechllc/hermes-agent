  - key: hermes_link_cli
    display_name: Hermes Link CLI (Mac/Titan communication protocol)
    category: fleet
    state: blocked_credentials
    reason: >
      `hermes link {status,queue,sync,chat}` is a real, wired CLI command
      (help text literally documents "Governed Mac / Titan Hermes
      communication") but every subcommand's client construction
      (hermes_cli/hermes_link/commands.py:_client(), lines 16-33) requires
      either HERMES_LINK_TOKEN or the signed-identity trio
      (HERMES_LINK_CREDENTIAL_REGISTRY + HERMES_LINK_COORDINATOR_NODE_ID +
      HERMES_LINK_TARGET_NODE_ID); none is set in this environment.
      Empirically confirmed: `hermes link status` fails with "link:
      HERMES_LINK_TOKEN is not configured" rather than succeeding — this
      entry was reclassified from an initial "active" guess after that
      spot-check, per this manifest's own "verify, don't guess" standard.
    validation_command: "hermes link status"
    implementation_paths:
      - hermes_cli/hermes_link/commands.py
      - hermes_cli/hermes_link/runtime.py
      - hermes_cli/subcommands/link.py
    requires_credentials: ["HERMES_LINK_TOKEN"]
    node: shared

