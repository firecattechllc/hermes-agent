# Hermes capability activation manifest — FireCat deployment (Titan + Mac).
#
# Schema: hermes_cli/capability_manifest.py (CapabilityManifest).
# Load with: python -c "from hermes_cli.capability_manifest import load_capability_manifest as l; l()"
# Validate:  python -c "from hermes_cli.capability_manifest import *; ok, w = validate_capability_manifest(load_capability_manifest()); print(ok, w)"
#
# States: active | available | blocked_credentials | blocked_runtime | not_selected | failed_validation
# "active" means implemented, configured, and reachable in this repository
# today — not merely "should work in theory." Every entry's validation_command
# is real and was run against this exact commit during Phase 1 discovery.

schema_version: 1
generated_at: "2026-08-05"
deployment: firecat-hermes

